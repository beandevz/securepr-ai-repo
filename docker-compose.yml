version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - QUEUE_PROVIDER=inproc
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SECUREPR_INGEST_SECRET=${SECUREPR_INGEST_SECRET}
      - RAG_ENABLED=${RAG_ENABLED:-false}
    volumes:
      - rag-data:/app/data
    networks:
      - securepr-network

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    environment:
      # Same-origin setup: the browser calls /api on the frontend origin
      # and nginx proxies it to the api service on this network.
      - API_BASE_URL=/api
      - API_UPSTREAM=http://api:8000
    depends_on:
      - api
    networks:
      - securepr-network

volumes:
  rag-data:

networks:
  securepr-network:
    driver: bridge
