version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - QUEUE_PROVIDER=inproc
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_ALLOWED_HOSTS=${GITHUB_ALLOWED_HOSTS:-github.com,github.boschdevcloud.com}
      - SECUREPR_INGEST_SECRET=${SECUREPR_INGEST_SECRET}
      - RAG_ENABLED=${RAG_ENABLED:-false}
    volumes:
      - rag-data:/app/data
    networks:
      - securepr-network

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    ports:
      - "5173:80"
    environment:
      # Same-origin setup: the browser calls /api on the frontend origin
      # and nginx proxies it to the api service on this network.
      - API_BASE_URL=/api
      - API_UPSTREAM=http://api:8000
    depends_on:
      - api
    networks:
      - securepr-network

volumes:
  rag-data:

networks:
  securepr-network:
    driver: bridge
